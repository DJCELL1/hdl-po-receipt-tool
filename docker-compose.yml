# HDL PO Receipt Tool - Docker Compose Configuration

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hdl_receipts_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hdl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-hdl_receipts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - hdl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hdl_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit App
  app:
    build: .
    container_name: hdl_receipts_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hdl_user}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-hdl_receipts}
      - CIN7_API_BASE_URL=${CIN7_API_BASE_URL}
      - CIN7_API_KEY=${CIN7_API_KEY}
      - CIN7_API_SECRET=${CIN7_API_SECRET}
      - TESSERACT_CMD=/usr/bin/tesseract
      - UPLOAD_DIR=/app/uploads
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hdl_network

volumes:
  postgres_data:
    driver: local

networks:
  hdl_network:
    driver: bridge
